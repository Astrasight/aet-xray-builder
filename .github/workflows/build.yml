name: Build AET DX11-AVX

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  XRAY_REPO: themrdemonized/xray-monolith
  XRAY_REF: caf8a33f3b14dcdd40c34dd0ed708689151ccf9e
  SOLUTION: src/engine-vs2022.sln
  CONFIGURATION: DX11-AVX
  ARTIFACT_NAME: AET-Reflected-Cone-v1.2-DX11-AVX

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout builder files
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Checkout X-Ray Monolith
        uses: actions/checkout@v4
        with:
          repository: ${{ env.XRAY_REPO }}
          ref: ${{ env.XRAY_REF }}
          path: xray
          submodules: recursive
          fetch-depth: 1

      - name: Configure pagefile
        uses: al-cheb/configure-pagefile-action@v1.3
        with:
          minimum-size: 8GB
          maximum-size: 8GB
          disk-root: "C:"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Verify source revision
        shell: pwsh
        run: |
          Set-Location xray
          $actual = (git rev-parse HEAD).Trim()
          Write-Host "Source revision: $actual"

          if ($actual -ne "${{ env.XRAY_REF }}") {
            throw "Wrong source revision: $actual"
          }

      - name: Apply AET v1.2 patch
        shell: pwsh
        run: |
          Set-Location xray

          git apply --check ../builder/patches/0001_aet_reflected_cone_v1.2_fullsource.patch
          git apply --whitespace=nowarn ../builder/patches/0001_aet_reflected_cone_v1.2_fullsource.patch

          Write-Host "Patch applied successfully"
          git diff --check
          git diff --stat

      - name: Build DX11-AVX
        shell: pwsh
        working-directory: xray
        run: |
          msbuild /m /p:Configuration=${{ env.CONFIGURATION }} ${{ env.SOLUTION }}

      - name: Collect files
        shell: pwsh
        run: |
          $bin = Join-Path $PWD "xray/_build/_game/bin_dbg"
          $exe = Join-Path $bin "AnomalyDX11AVX.exe"

          if (!(Test-Path $exe)) {
            Write-Host "Contents of bin_dbg:"
            if (Test-Path $bin) {
              Get-ChildItem $bin | Format-Table Name, Length
            }

            throw "AnomalyDX11AVX.exe was not produced"
          }

          New-Item -ItemType Directory -Force -Path artifact | Out-Null

          Copy-Item $exe "artifact/AnomalyDX11AVX.exe"

          $pdb = Join-Path $bin "AnomalyDX11AVX.pdb"
          if (Test-Path $pdb) {
            Copy-Item $pdb "artifact/AnomalyDX11AVX.pdb"
          }

          $hash = (Get-FileHash "artifact/AnomalyDX11AVX.exe" -Algorithm SHA256).Hash

          @(
            "Aeternelle 3DSS Reflected Cone v1.2"
            "Source commit: ${{ env.XRAY_REF }}"
            "Configuration: ${{ env.CONFIGURATION }}"
            "AnomalyDX11AVX.exe SHA256: $hash"
            "GitHub Actions run: ${{ github.run_id }}"
          ) | Set-Content "artifact/BUILD_INFO.txt" -Encoding UTF8

          Write-Host "EXE SHA256: $hash"
          Get-ChildItem artifact | Format-Table Name, Length

      - name: Upload built EXE
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact/*
          if-no-files-found: error
          retention-days: 7
